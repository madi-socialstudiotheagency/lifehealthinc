<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Get a Quote - Life Health Inc</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
}
        .container {
                      background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
}
        h1 {
                      margin-bottom: 10px;
            color: #333;
            font-size: 32px;
}
        .subtitle {
                      color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .form-group {
                      margin-bottom: 20px;
}
        label {
                      display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
}
        input, select {
                      width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
}
        input:focus, select:focus {
                      outline: none;
            border-color: #667eea;
        }
        button {
                      width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
}
        button:hover {
                      transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
}
        button:active {
                      transform: translateY(0);
}
        .required {
            color: #e74c3c;
            }
    </style>
      </head>
      <body>
          <div class="container">
              <h1>Get Your Free Quote</h1>
              <p class="subtitle">We're here to help. Fill out the form below and we'll be in touch shortly.</p>

              <form name="quote-request" method="POST" netlify>
                  <div class="form-group">
                      <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required>
                  </div>

                  <div class="form-group">
                      <label for="email">Email <span class="required">*</span></label>
                      <input type="email" id="email" name="email" required>
                  </div>

                  <div class="form-group">
                      <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" required>
                  </div>

                  <div class="form-group">
                      <label for="interest">What are you interested in? <span class="required">*</span></label>
                      <select id="interest" name="interest" required>
                          <option value="">-- Select an option --</option>
                          <option value="General Consultation">General Consultation</option>
                          <option value="Wellness Program">Wellness Program</option>
                          <option value="Health Assessment">Health Assessment</option>
                          <option value="Other">Other</option>
                      </select>
                  </div>

                  <button type="submit">Get Your Free Quote</button>
              </form>
          </div>
      </body>
      </html>
