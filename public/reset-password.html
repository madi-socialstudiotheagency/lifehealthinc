<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a new password — LifeHealthInc</title>
<link rel="icon" type="image/png" href="/assets/img/6bb5a4d12_Untitleddesign.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#081730;--blue:#1A3586;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--wash:#F4F6FA}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wash);font-family:Jost,'Helvetica Neue',Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:var(--navy);padding:16px 24px}
  header .brand{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto}
  header img{width:42px;height:41px;border-radius:8px;display:block}
  header .name{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;color:#fff;line-height:22px}
  header .tag{font-size:11px;letter-spacing:.6px;color:#B9C4E0;margin-top:2px}
  main{max-width:520px;margin:28px auto 60px;padding:0 16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(8,23,48,.08);padding:28px 24px}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:24px;line-height:30px;color:var(--blue);margin:0 0 8px}
  p.lead{margin:0 0 22px;font-size:15px;line-height:23px;color:var(--ink)}
  .lbl{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
  button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 24px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:18px}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#b91c1c;font-size:13px;margin:8px 0 0;min-height:18px}
  .foot{margin-top:18px;font-size:12px;line-height:18px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  .foot a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header><div class="brand">
  <a href="/" style="display:flex;align-items:center;gap:12px;text-decoration:none"><img src="/assets/img/6bb5a4d12_Untitleddesign.png" alt="LifeHealthInc">
  <div><div class="name">LifeHealthInc</div><div class="tag">Life / Health and Everything Incorporated</div></div></a>
</div></header>
<main>
<div class="card" id="card">
  <h1>Choose a new password</h1>
  <p class="lead" id="lead">Pick something you don't use anywhere else.</p>
  <form id="f" novalidate>
    <label class="lbl">New password</label>
    <input type="password" name="password" id="password" autocomplete="new-password" minlength="8" required>
    <div class="hint">At least 8 characters.</div>
    <div style="height:14px"></div>
    <label class="lbl">Confirm new password</label>
    <input type="password" name="confirm" id="confirm" autocomplete="new-password" required>
    <p class="err" id="err"></p>
    <button type="submit" id="btn">Update password</button>
  </form>
  <div class="foot">Questions? <a href="tel:9545430853">(954) 543-0853</a><br>Partnered with <a href="https://www.socialstudiotheagency.com" target="_blank" rel="noopener">Social Studio The Agency</a> for marketing, automation and web.</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  var f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err'),lead=document.getElementById('lead');
  var ENDPOINT='https://ytyjawfaptjdguxykzem.supabase.co/functions/v1/lhi-forms';
  var params=new URLSearchParams(location.search), token=params.get('token');
  var sb=window.supabase&&window.supabase.createClient('https://ytyjawfaptjdguxykzem.supabase.co','sb_publishable_bSzUO4KLJRDS8nwAQ93ZEQ_TFXjhgP0',{auth:{persistSession:true,storageKey:'lhi-portal'}});
  if(!token){
    f.style.display='none';
    lead.textContent='This reset link is missing its token. Please request a new one from the link on the sign-in page.';
    err.innerHTML='<a href="/forgot-password.html" style="color:#1A3586;font-weight:600">Request a new reset link</a>';
  }
  f.addEventListener('submit',async function(e){
    e.preventDefault(); err.textContent='';
    var pw=f.password.value, cf=f.confirm.value;
    if(pw.length<8){err.textContent='Your password needs at least 8 characters.';return}
    if(pw!==cf){err.textContent='Passwords do not match.';return}
    btn.disabled=true; btn.textContent='Updating…';
    try{
      var r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({form:'portal_reset_password',token:token,password:pw})});
      var j=await r.json().catch(function(){return{}});
      if(!r.ok||!j.ok){
        err.innerHTML=(j.error||'Something went wrong. Please call (954) 543-0853.')+' <a href="/forgot-password.html" style="color:#1A3586;font-weight:600">Request a new link</a>';
        btn.disabled=false; btn.textContent='Update password'; return;
      }
      if(sb && j.email){var s=await sb.auth.signInWithPassword({email:j.email,password:pw});if(!s.error){location.href='/client-portal';return}}
      location.href='/Clients';
    }catch(x){err.textContent='Network error. Please try again or call (954) 543-0853.';btn.disabled=false;btn.textContent='Update password'}
  });
})();
</script>
</body>
</html>
